<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 200 1600 340" role="img" aria-labelledby="title desc">
  <title id="title">A 480i patch, progressive output, and horizontal upscaling signal path</title>
  <desc id="desc">A four-stage diagram: a 480i-patched Nintendo 64 ROM produces alternating fields; Analogue3D Progressive Output can produce the full original framebuffer every frame; Horizontal Upscaling doubles 3D detail across the image; the final image is sent to a display. The second and third stages are optional Analogue3D features.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#aaccff"/>
    </marker>
    <pattern id="fieldOdd" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#00003c"/>
      <rect width="10" height="3" fill="#e9be52"/>
    </pattern>
    <pattern id="fieldEven" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#00003c"/>
      <rect y="5" width="10" height="3" fill="#aaccff"/>
    </pattern>
    <pattern id="fieldBoth" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#00003c"/>
      <rect width="10" height="3" fill="#e9be52"/>
      <rect y="5" width="10" height="3" fill="#aaccff"/>
    </pattern>
  </defs>

  <path d="M272 441 H520 M732 441 H915 M1123 441 H1327" fill="none" stroke="#aaccff" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)" opacity=".82"/>
  <path d="M80 599 H1514" fill="none" stroke="#aaccff" stroke-opacity=".28" stroke-width="2"/>

  <g>
    <path d="M74 272 L121 224 H302 L344 272 V498 H74 Z" fill="#00003c" stroke="#e9be52" stroke-width="8"/>
    <path d="M121 224 H302 L326 252 H96 Z" fill="#e9be52"/>
    <rect x="101" y="310" width="215" height="154" fill="#0b0b78" stroke="#aaccff" stroke-width="3"/>
    <rect x="125" y="334" width="73" height="104" fill="url(#fieldOdd)"/>
    <rect x="218" y="334" width="73" height="104" fill="url(#fieldEven)"/>
  </g>

  <g>
    <circle cx="626" cy="365" r="145" fill="#0b0b78" stroke="#e9be52" stroke-width="8"/>
    <circle cx="626" cy="365" r="111" fill="#00003c" stroke="#aaccff" stroke-width="3"/>
    <path d="M563 323 H689 M563 362 H689 M563 401 H689" fill="none" stroke="#ffffdd" stroke-width="9" stroke-linecap="round"/>
    <path d="M626 278 V450" fill="none" stroke="#aaccff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g>
    <path d="M912 263 H1103 L1144 304 V464 H912 Z" fill="#00003c" stroke="#aaccff" stroke-width="8"/>
    <path d="M945 303 H1082 V424 H945 Z" fill="#0b0b78"/>
    <path d="M967 319 H1060 M967 344 H1060 M967 369 H1060 M967 394 H1060" stroke="#e9be52" stroke-width="8" stroke-linecap="round"/>
    <path d="M990 307 V420 M1014 307 V420 M1038 307 V420" stroke="#ffffdd" stroke-width="4" opacity=".9"/>
  </g>

  <g>
    <rect x="1326" y="236" width="194" height="256" rx="4" fill="#00003c" stroke="#e9be52" stroke-width="8"/>
    <rect x="1350" y="260" width="146" height="176" fill="url(#fieldBoth)"/>
    <path d="M1395 492 V525 M1361 525 H1486" fill="none" stroke="#aaccff" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
