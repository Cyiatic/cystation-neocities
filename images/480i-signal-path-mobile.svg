<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
  <title id="title">A 480i patch, progressive output, and horizontal upscaling signal path</title>
  <desc id="desc">A compact four-stage signal path: a 480i-patched Nintendo 64 ROM, optional Analogue3D Progressive Output, optional Horizontal Upscaling, and a display.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#99ccff"/>
    </marker>
    <pattern id="fieldOdd" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#001b49"/>
      <rect width="10" height="3" fill="#ffcc00"/>
    </pattern>
    <pattern id="fieldEven" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#001b49"/>
      <rect y="5" width="10" height="3" fill="#99ccff"/>
    </pattern>
    <linearGradient id="displayGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#33ff33" stop-opacity=".95"/>
      <stop offset=".48" stop-color="#99ccff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffcc00" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <path d="M244 166 H348 M480 292 V354 H162 V415 M280 527 H386" fill="none" stroke="#99ccff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" opacity=".82"/>

  <g filter="url(#shadow)">
    <path d="M43 74 L76 40 H213 L244 74 V256 H43 Z" fill="#001b49" stroke="#ffcc00" stroke-width="7"/>
    <path d="M76 40 H213 L232 60 H57 Z" fill="#ffcc00"/>
    <rect x="64" y="106" width="159" height="111" fill="#003466" stroke="#99ccff" stroke-width="3"/>
    <rect x="82" y="124" width="53" height="76" fill="url(#fieldOdd)"/>
    <rect x="151" y="124" width="53" height="76" fill="url(#fieldEven)"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="480" cy="166" r="126" fill="#003466" stroke="#ffcc00" stroke-width="7"/>
    <circle cx="480" cy="166" r="95" fill="#001b49" stroke="#99ccff" stroke-width="3"/>
    <path d="M425 132 H535 M425 166 H535 M425 200 H535" fill="none" stroke="#ffffdd" stroke-width="8" stroke-linecap="round"/>
    <path d="M480 93 V239" fill="none" stroke="#33ff33" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M42 414 H230 L269 453 V610 H42 Z" fill="#001b49" stroke="#99ccff" stroke-width="7"/>
    <path d="M70 450 H245 V570 H70 Z" fill="#003466"/>
    <path d="M91 467 H224 M91 492 H224 M91 517 H224 M91 542 H224" stroke="#ffcc00" stroke-width="8" stroke-linecap="round"/>
    <path d="M124 456 V562 M148 456 V562 M172 456 V562" stroke="#33ff33" stroke-width="4" opacity=".9"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="386" y="413" width="206" height="220" rx="4" fill="#001b49" stroke="#ffcc00" stroke-width="7"/>
    <rect x="412" y="439" width="154" height="145" fill="url(#displayGlow)"/>
    <path d="M489 633 V663 M451 663 H527" fill="none" stroke="#99ccff" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
